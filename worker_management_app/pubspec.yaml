name: worker_management_app
description: "Watchpost: field call management for workers and managers"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# version: <versionName>+<versionCode>
# Every upload to Google Play needs a HIGHER number after the +
# (1.0.0+1, then 1.0.1+2, then 1.0.2+3, ...). The part before the + is what
# users see. The number after the + can never be reused.
version: 1.0.0+3

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^4.5.0
  firebase_auth: ^6.2.0
  cloud_firestore: ^6.1.3
  firebase_storage: ^13.1.0
  cloud_functions: ^6.0.7
  firebase_messaging: ^16.1.2

  # State management & dependency injection
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2

  # Routing
  go_router: ^17.1.0

  # Signature pad for close call screen
  signature: ^6.3.0

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1
  shared_preferences: ^2.3.3
  url_launcher: ^6.3.1
  firebase_app_check: ^0.4.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^4.0.3

  # Generates the Android launcher icons and the web icons from assets/icon/.
  # Run: dart run flutter_launcher_icons
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true

  # No assets section needed for the icons: assets/icon/ is only read by
  # flutter_launcher_icons at generation time, not bundled into the app.

# Launcher icon configuration (used by `dart run flutter_launcher_icons`)
flutter_launcher_icons:
  # Replaces the default Flutter icon (ic_launcher), so the manifest stays as is
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21

  # Adaptive icon (Android 8+): blue background + white tower.
  # The foreground image already has the safe-zone padding, so inset is 0.
  adaptive_icon_background: "#1976D2"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  adaptive_icon_foreground_inset: 0
  # Android 13+ "Themed icons" setting
  adaptive_icon_monochrome: "assets/icon/icon_monochrome.png"

  # Browser tab favicon + "install app" icons for watchpost-il.web.app
  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#1976D2"
    theme_color: "#1976D2"
